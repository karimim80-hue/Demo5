<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تمدن‌ها — نسخه ۰.۶</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3ynhPi3Kk0xjMZ2l5xW0QJmZ1w9pI=" crossorigin="">
<style>
:root{--bg:#eef2f6;--panel:#fff;--ink:#172033;--muted:#687386;--line:#d6dee8;--blue:#315f9d;--red:#b43d5d;--green:#2c7a55;--gold:#b4872b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}.app{max-width:1500px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.top h1{margin:0}.top p{margin:6px 0;color:var(--muted)}.status{background:#e7f4ec;color:#1f6c42;padding:7px 11px;border-radius:999px}.panel{background:white;border:1px solid var(--line);border-radius:15px;box-shadow:0 5px 18px #26364a0c}.controls{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;padding:14px;margin-top:14px;align-items:end}label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}input,select,button{font:inherit}input[type=search],select{height:40px;border:1px solid #cbd4df;border-radius:9px;padding:0 10px;background:white}input[type=range]{width:100%}.yearline{display:flex;align-items:center;gap:10px}.yearline strong{min-width:90px}button{border:0;border-radius:9px;padding:10px 13px;background:#243b5a;color:white;cursor:pointer}.secondary{background:#edf2f7;color:#243b5a}.playbar{display:flex;gap:8px;flex-wrap:wrap}.summary{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.badge{background:#e5ebf2;color:#4d5d72;padding:5px 10px;border-radius:999px;font-size:12px}.workspace{display:grid;grid-template-columns:minmax(620px,1.2fr) minmax(420px,.8fr);gap:14px}.gantt{padding:12px;overflow:hidden}.axis{display:flex;justify-content:space-between;padding:0 0 7px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}.rows{max-height:640px;overflow:auto}.group{position:sticky;top:0;z-index:2;background:#e9eff6;padding:8px 10px;border-radius:7px;margin-top:7px;font-weight:bold;display:flex;justify-content:space-between}.row{display:grid;grid-template-columns:22px 230px 1fr;gap:8px;align-items:center;min-height:48px;border-bottom:1px solid #edf0f4;cursor:pointer}.row:hover{background:#f7f9fc}.row.selected{background:#fff0f4;border-right:4px solid var(--red)}.dot{width:10px;height:10px;border-radius:50%;background:var(--blue)}.name b{display:block}.name small{color:var(--muted)}.track{height:22px;position:relative;background-image:linear-gradient(to left,#e7ebf1 1px,transparent 1px);background-size:10% 100%}.bar{position:absolute;top:3px;height:16px;background:var(--blue);border-radius:5px}.row.selected .bar{background:var(--red)}.side{display:flex;flex-direction:column;gap:14px}.mapbox,.details,.events,.compare,.changes{padding:12px}#map{height:410px;border-radius:12px;border:1px solid #ccd6e1}.mapnote{font-size:11px;color:var(--muted);margin-top:7px}.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 9px;font-size:13px}.kv span:nth-child(odd){color:var(--muted)}.event,.change{padding:8px 10px;border-radius:8px;margin:7px 0;background:#fbf7ec;border-right:3px solid var(--gold)}.change.in{background:#edf8f1;border-color:var(--green)}.change.out{background:#fff0f3;border-color:var(--red)}.empty{color:var(--muted);font-size:13px}.flash{animation:flash .8s}@keyframes flash{0%{box-shadow:0 0 0 4px #ffcf6677}100%{box-shadow:none}}@media(max-width:1050px){.controls{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr}}@media(max-width:650px){.controls{grid-template-columns:1fr}.row{grid-template-columns:18px 1fr}.track{grid-column:2}.top{flex-direction:column}#map{height:330px}}
</style></head><body><main class="app"><div class="top"><div><h1>تمدن‌ها</h1><p>گانت تاریخ، نقشهٔ واقعی، پخش زمان و تغییرات حکومت‌ها</p></div><span class="status">نسخهٔ نمایشی ۰.۶</span></div>
<section class="panel controls"><label style="grid-column:span 2">سال انتخاب‌شده<div class="yearline"><input id="year" type="range"><strong id="yearLabel"></strong></div></label><label>جست‌وجو<input id="search" type="search" placeholder="نام حکومت..."></label><label>دسته‌بندی<select id="category"></select></label><label>نمایش<select id="mode"><option value="active">فعال در سال</option><option value="all">همه حکومت‌ها</option></select></label><div class="playbar" style="grid-column:1/-1"><button id="prev">◀ ۱۰ سال</button><button id="play">▶ پخش</button><button id="next">۱۰ سال ▶</button><select id="speed"><option value="900">آهسته</option><option value="450" selected>عادی</option><option value="180">سریع</option></select><button class="secondary" id="reset">بازنشانی</button></div></section>
<div class="summary"><span class="badge" id="count"></span><span class="badge" id="selected"></span><span class="badge" id="eventCount"></span></div>
<section class="workspace"><section class="panel gantt"><div class="axis" id="axis"></div><div class="rows" id="rows"></div></section><aside class="side"><section class="panel mapbox"><h3 style="margin-top:0">نقشهٔ تاریخی</h3><div id="map"></div><div class="mapnote">مرزهای رنگی این نسخه تقریبی و صرفاً برای نمایش رفتار محصول‌اند؛ مبنای پژوهشی نهایی نیستند. نقاط آبی مرکز نمایندهٔ حکومت‌ها هستند.</div></section><section class="panel changes"><h3>چه چیزی با زمان تغییر کرد؟</h3><div id="changes"></div></section><section class="panel details" id="details"></section><section class="panel compare" id="compare"></section><section class="panel events"><h3>رویدادهای نزدیک</h3><div id="events"></div></section></aside></section></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
let DB={polities:[],events:[],snapshots:{}};const els={year:document.getElementById('year'),search:document.getElementById('search'),category:document.getElementById('category'),mode:document.getElementById('mode')};let selected=[],timer=null,lastActive=new Set();let map,layerGroup;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fy=y=>y<0?Math.abs(y).toLocaleString('fa-IR')+' ق.م':y.toLocaleString('fa-IR')+' م';
fetch('data.json').then(r=>r.json()).then(d=>{DB=d;init()}).catch(e=>document.body.insertAdjacentHTML('beforeend','<p>خطا در بارگذاری داده‌ها</p>'));
function init(){const P=DB.polities;els.year.min=Math.min(...P.map(x=>x.start));els.year.max=Math.max(...P.map(x=>x.end));els.year.value=-550;els.category.innerHTML=['همه',...new Set(P.map(x=>x.category))].map(x=>`<option>${esc(x)}</option>`).join('');map=L.map('map',{worldCopyJump:true}).setView([32,50],4);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:8,attribution:'© OpenStreetMap'}).addTo(map);layerGroup=L.layerGroup().addTo(map);[els.year,els.search,els.category,els.mode].forEach(el=>el.addEventListener(el===els.year?'input':'change',render));els.search.addEventListener('input',render);document.getElementById('prev').onclick=()=>step(-10);document.getElementById('next').onclick=()=>step(10);document.getElementById('reset').onclick=()=>{stop();els.year.value=-550;els.search.value='';els.category.value='همه';els.mode.value='active';selected=[];lastActive=new Set();render()};document.getElementById('play').onclick=togglePlay;render();}
function step(n){let v=+els.year.value+n;if(v===0)v=n>0?1:-1;v=Math.max(+els.year.min,Math.min(+els.year.max,v));els.year.value=v;render()}
function togglePlay(){if(timer){stop();return}document.getElementById('play').textContent='■ توقف';const run=()=>{step(10);if(+els.year.value>=+els.year.max)stop()};timer=setInterval(run,+document.getElementById('speed').value)}function stop(){if(timer)clearInterval(timer);timer=null;document.getElementById('play').textContent='▶ پخش'}
function filtered(){const y=+els.year.value,q=els.search.value.trim().toLowerCase(),cat=els.category.value;return DB.polities.filter(x=>(els.mode.value==='all'||(x.start<=y&&x.end>=y))&&(cat==='همه'||x.category===cat)&&(!q||(x.name+' '+x.en).toLowerCase().includes(q)))}
function toggle(id){selected.includes(id)?selected=selected.filter(x=>x!==id):selected=selected.length<2?[...selected,id]:[selected[1],id];render()}
function nearestSnapshot(p,y){const arr=DB.snapshots[String(p.id)]||[];if(!arr.length)return null;return arr.reduce((a,b)=>Math.abs(b.year-y)<Math.abs(a.year-y)?b:a)}
function renderMap(items,y){layerGroup.clearLayers();const bounds=[];items.slice(0,80).forEach(p=>{const m=L.circleMarker([p.lat,p.lng],{radius:selected.includes(p.id)?8:5,color:'#fff',weight:1.5,fillColor:selected.includes(p.id)?'#b43d5d':'#315f9d',fillOpacity:.95}).bindTooltip(p.name);m.on('click',()=>toggle(p.id));m.addTo(layerGroup);bounds.push([p.lat,p.lng]);const snap=nearestSnapshot(p,y);if(snap&&Math.abs(snap.year-y)<=120){const poly=L.polygon(snap.coords,{color:selected.includes(p.id)?'#b43d5d':'#315f9d',weight:2,fillOpacity:selected.includes(p.id)?.28:.16,dashArray:'5 4'}).bindPopup(`<b>${esc(p.name)}</b><br>${esc(snap.label)}<br>${fy(snap.year)}<br><small>مرز تقریبی دمو</small>`);poly.addTo(layerGroup);bounds.push(...snap.coords)}});DB.events.filter(e=>Math.abs(e.start-y)<=15).forEach(e=>{L.circleMarker([e.lat,e.lng],{radius:7,color:'#8a6720',fillColor:'#f0c65c',fillOpacity:1}).bindPopup(`<b>${esc(e.name)}</b><br>${fy(e.start)}`).addTo(layerGroup)});if(bounds.length&&selected.length){const ps=selected.map(id=>DB.polities.find(p=>p.id===id)).filter(Boolean);map.fitBounds(ps.map(p=>[p.lat,p.lng]),{padding:[40,40],maxZoom:5})}}
function renderChanges(active,y){const now=new Set(active.map(x=>x.id)),ins=[...now].filter(x=>!lastActive.has(x)),outs=[...lastActive].filter(x=>!now.has(x));const box=document.getElementById('changes');if(lastActive.size===0){box.innerHTML='<p class="empty">زمان را جلو یا عقب ببرید تا ظهور و پایان حکومت‌ها ثبت شود.</p>'}else{const rows=[];ins.forEach(id=>rows.push(`<div class="change in">ظهور/ورود: <b>${esc(DB.polities.find(x=>x.id===id)?.name)}</b> در ${fy(y)}</div>`));outs.forEach(id=>rows.push(`<div class="change out">پایان/خروج: <b>${esc(DB.polities.find(x=>x.id===id)?.name)}</b> در ${fy(y)}</div>`));box.innerHTML=rows.join('')||'<p class="empty">در این گام ده‌ساله تغییری ثبت نشد.</p>'}lastActive=now}
function render(){const P=DB.polities,y=+els.year.value,items=filtered(),active=P.filter(x=>x.start<=y&&x.end>=y);document.getElementById('yearLabel').textContent=fy(y);document.getElementById('count').textContent=items.length.toLocaleString('fa-IR')+' حکومت در نما';document.getElementById('selected').textContent='انتخاب: '+(selected.length?selected.map(id=>P.find(x=>x.id===id)?.name).join(' + '):'هیچ‌کدام');const near=DB.events.filter(e=>Math.abs(e.start-y)<=30);document.getElementById('eventCount').textContent=near.length.toLocaleString('fa-IR')+' رویداد نزدیک';const min=+els.year.min,max=+els.year.max,pct=v=>((v-min)/(max-min))*100;document.getElementById('axis').innerHTML=[min,Math.round((min+max)/2),max].map(fy).map(x=>`<span>${x}</span>`).join('');const groups={};items.forEach(x=>(groups[x.category]??=[]).push(x));let html='';Object.entries(groups).forEach(([g,list])=>{html+=`<div class="group"><span>${esc(g)}</span><span>${list.length.toLocaleString('fa-IR')}</span></div>`;list.forEach(x=>html+=`<div class="row ${selected.includes(x.id)?'selected':''}" data-id="${x.id}"><span class="dot"></span><div class="name"><b>${esc(x.name)}</b><small>${fy(x.start)} تا ${fy(x.end)}</small></div><div class="track"><i class="bar" style="right:${100-pct(x.end)}%;width:${Math.max(.3,pct(x.end)-pct(x.start))}%"></i></div></div>`)});document.getElementById('rows').innerHTML=html||'<p class="empty">موردی پیدا نشد.</p>';document.querySelectorAll('.row').forEach(r=>r.onclick=()=>toggle(+r.dataset.id));renderMap(items,y);renderChanges(active,y);const d=selected.length?P.find(x=>x.id===selected.at(-1)):items[0];document.getElementById('details').innerHTML=d?`<h3>${esc(d.name)}</h3><div class="kv"><span>نام انگلیسی</span><span>${esc(d.en)}</span><span>بازه</span><span>${fy(d.start)} تا ${fy(d.end)}</span><span>منطقه</span><span>${esc(d.region)}</span><span>پایتخت‌ها</span><span>${esc(d.capitals)}</span><span>یادداشت</span><span>${esc(d.notes)}</span><span>وضعیت داده</span><span>${esc(d.validation)}</span></div>`:'<h3>جزئیات</h3><p class="empty">حکومتی انتخاب نشده است.</p>';document.getElementById('events').innerHTML=near.length?near.map(e=>`<div class="event"><b>${esc(e.name)}</b> — ${fy(e.start)}<br><small>${esc(e.summary)}</small></div>`).join(''):'<p class="empty">رویدادی در بازهٔ ±۳۰ سال ثبت نشده است.</p>';if(selected.length===2){const a=P.find(x=>x.id===selected[0]),b=P.find(x=>x.id===selected[1]),s=Math.max(a.start,b.start),e=Math.min(a.end,b.end);document.getElementById('compare').innerHTML=`<h3>مقایسه</h3><p><b>${esc(a.name)}</b> و <b>${esc(b.name)}</b></p><p>${s<=e?'هم‌پوشانی زمانی: '+fy(s)+' تا '+fy(e):'هم‌پوشانی زمانی ندارند.'}</p>`}else document.getElementById('compare').innerHTML='<h3>مقایسه</h3><p class="empty">برای مقایسه دو حکومت را انتخاب کنید.</p>'}
</script></body></html>
